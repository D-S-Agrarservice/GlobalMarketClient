name: CI

# Pushes to main are not built: main is fast-forwarded to an already built commit.
# Own pushes and PRs run on the self-hosted runners. Pull requests from forks never
# do: they run on GitHub-hosted runners (verify-fork), which are free for public
# repositories. A fork PR can still edit this file, so the repository also requires
# approval of workflow runs for outside contributors; check `.github/` changes in
# the PR before approving.
on:
  push:
    branches:
      - "develop*"
  pull_request:
    branches:
      - main
      - develop_floowy

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/ci-image.yml
    permissions:
      contents: read
      packages: write

  verify-windows:
    name: Verify (windows self-hosted)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, floowy-win]
    steps: &verify-steps
      - name: Prepare self-hosted Windows runner
        if: runner.os == 'Windows' && runner.environment == 'self-hosted'
        shell: pwsh
        run: |
          # `bash` resolves to WSL on this machine, the steps need Git Bash.
          $git = Split-Path (Split-Path (Get-Command git).Source)
          $bash = Join-Path $git 'bin'
          if (-not (Test-Path (Join-Path $bash 'bash.exe'))) { throw "Git Bash not found in $bash" }
          $bash >> $env:GITHUB_PATH
          # Own Rust, so a job never touches the toolchain of the machine's owner.
          "CARGO_HOME=$env:RUNNER_TOOL_CACHE\cargo" >> $env:GITHUB_ENV
          "RUSTUP_HOME=$env:RUNNER_TOOL_CACHE\rustup" >> $env:GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # Not on the self-hosted Windows runner: its CARGO_HOME is kept between jobs.
      - name: Cache Rust build artifacts
        if: runner.os != 'Windows'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build TypeScript & Vite frontend
        run: npm run build

      - name: Check Rust workspace & targets
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Run Rust integration & security test suite
        run: cargo test --manifest-path src-tauri/Cargo.toml --test bridge_suite

  verify-linux:
    name: Verify (linux self-hosted)
    needs: image
    runs-on: [self-hosted, Linux, X64, bydora]
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps: *verify-steps

  # Pull requests from forks: GitHub-hosted runners only, no secrets, read-only token.
  verify-fork:
    name: Verify fork PR (${{ matrix.os }})
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-22.04
          - macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build TypeScript & Vite frontend
        run: npm run build

      - name: Check Rust workspace & targets
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Run Rust integration & security test suite
        run: cargo test --manifest-path src-tauri/Cargo.toml --test bridge_suite
