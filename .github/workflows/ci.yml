name: CI

on:
  push:
    branches:
      - main
      - develop_floowy
      - "develop*"
  pull_request:
    branches:
      - main
      - develop_floowy

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    uses: ./.github/workflows/ci-image.yml
    permissions:
      contents: read
      packages: write

  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps: &verify-steps
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build TypeScript & Vite frontend
        run: npm run build

      - name: Check Rust workspace & targets
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Run Rust integration & security test suite
        run: cargo test --manifest-path src-tauri/Cargo.toml --test bridge_suite

  verify-linux:
    name: Verify (linux self-hosted)
    needs: image
    runs-on: [self-hosted, Linux, X64, bydora]
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps: *verify-steps
