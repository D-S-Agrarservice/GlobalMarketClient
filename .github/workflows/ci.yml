name: CI

on:
  push:
    branches:
      - main
      - develop_floowy
      - "develop*"
  pull_request:
    branches:
      - main
      - develop_floowy

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    # Empty for the GitHub-hosted entries, which then run without a container.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-latest
            runner: windows-latest
          - label: linux self-hosted
            runner: [self-hosted, Linux, X64, bydora]
            container: ubuntu:22.04
          - label: macos-latest
            runner: macos-latest

    steps:
      # Self-hosted Linux runs in a job container as root, so no sudo. The base
      # image lacks the tools checkout and the setup actions need, too.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl wget file git xz-utils build-essential pkg-config \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build TypeScript & Vite frontend
        run: npm run build

      - name: Check Rust workspace & targets
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Run Rust integration & security test suite
        run: cargo test --manifest-path src-tauri/Cargo.toml --test bridge_suite
