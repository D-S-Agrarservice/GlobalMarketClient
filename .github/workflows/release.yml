name: Release Build

on:
  push:
    tags:
      - "v*.*.*"
      - "[0-9]*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v0.9.16-beta or v1.0.0)"
        required: true
        default: "v0.9.16-beta"
      prerelease:
        description: "Mark release as Pre-release (Beta / RC)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  image:
    uses: ./.github/workflows/ci-image.yml
    permissions:
      contents: read
      packages: write

  prepare:
    name: Check Release Target
    runs-on: [self-hosted, Linux, X64, bydora]
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      tag_name: ${{ steps.check.outputs.tag_name }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Determine release state
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi

          IS_PRERELEASE="false"
          if [ "$INPUT_PRERELEASE" = "true" ] || [[ "$TAG" == *-* ]]; then
            IS_PRERELEASE="true"
          fi

          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

          # Publishing a Draft Release in the GitHub Web UI creates the Git tag and triggers
          # a tag `push` event. Skip rebuilding if a release with uploaded assets already exists.
          RELEASES_JSON=$(gh api "repos/${{ github.repository }}/releases?per_page=30")
          if [ "$EVENT_NAME" = "push" ]; then
            EXISTING_WITH_ASSETS=$(printf '%s' "$RELEASES_JSON" | \
              jq --arg tag "$TAG" '[.[] | select(.tag_name == $tag and (.assets | length) > 0)] | length')
            if [ "${EXISTING_WITH_ASSETS:-0}" -gt 0 ]; then
              echo "Release for tag '$TAG' already exists with uploaded assets — skipping duplicate build."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            ALREADY_PUBLISHED=$(printf '%s' "$RELEASES_JSON" | \
              jq --arg tag "$TAG" '[.[] | select(.tag_name == $tag and .draft == false)] | length')
            if [ "${ALREADY_PUBLISHED:-0}" -gt 0 ]; then
              echo "::error::Published release for tag '$TAG' already exists and is immutable on GitHub. Please choose a new tag version (e.g. v0.9.12-beta or v1.0.0)."
              exit 1
            fi
          fi

          echo "should_build=true" >> "$GITHUB_OUTPUT"

  publish-tauri:
    name: Release (${{ matrix.label }})
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: [self-hosted, Windows, X64, floowy-win]
            label: Windows x64
            args: ""
            # Drops the WiX culture from the MSI name (..._x64_en-US.msi -> ..._x64.msi).
            asset_names: "[name]_[version]_[arch][setup][ext]"
          - platform: macos
            runner: macos-latest
            label: macOS Universal
            args: "--target universal-apple-darwin"

    steps: &publish-steps
      - name: Prepare self-hosted Windows runner
        if: runner.os == 'Windows' && runner.environment == 'self-hosted'
        shell: pwsh
        run: |
          # `bash` resolves to WSL on this machine, the steps need Git Bash.
          $git = Split-Path (Split-Path (Get-Command git).Source)
          $bash = Join-Path $git 'bin'
          if (-not (Test-Path (Join-Path $bash 'bash.exe'))) { throw "Git Bash not found in $bash" }
          $bash >> $env:GITHUB_PATH
          # Own Rust, so a job never touches the toolchain of the machine's owner.
          "CARGO_HOME=$env:RUNNER_TOOL_CACHE\cargo" >> $env:GITHUB_ENV
          "RUSTUP_HOME=$env:RUNNER_TOOL_CACHE\rustup" >> $env:GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Not on the self-hosted Windows runner: its CARGO_HOME is kept between jobs.
      - name: Cache Rust build artifacts
        if: runner.os != 'Windows'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Detect signing configuration
        id: signing
        shell: bash
        env:
          SIGN_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$SIGN_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "extra_args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "extra_args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & upload GlobalMarketClient bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The AppImage tooling needs FUSE, which the Linux job container lacks.
          # Ignored on Windows/macOS.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GM_EXTENDED_KEY_DIGEST: ${{ secrets.GM_EXTENDED_KEY_DIGEST }}
          GM_DEVELOPER_KEY_DIGEST: ${{ secrets.GM_DEVELOPER_KEY_DIGEST }}
        with:
          tagName: ${{ needs.prepare.outputs.tag_name }}
          releaseName: "GlobalMarketClient ${{ needs.prepare.outputs.tag_name }}"
          releaseBody: |
            ## GlobalMarketClient ${{ needs.prepare.outputs.tag_name }} (`D-S-Agrarservice`)

            Cross-platform companion application for the Farming Simulator **GlobalMarket** mod.

            ### Downloads
            - **Windows (10/11 x64):** `GlobalMarketClient_x.x.x_x64-setup.exe`
            - **macOS (Apple Silicon & Intel Universal):** `GlobalMarketClient_x.x.x_universal.dmg`
            - **Linux (Ubuntu/Debian/SteamOS x64):** `.AppImage` / `.deb`
          releaseDraft: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          includeUpdaterJson: ${{ steps.signing.outputs.enabled == 'true' }}
          args: ${{ matrix.args }} ${{ steps.signing.outputs.extra_args }}
          assetNamePattern: ${{ matrix.asset_names }}

  publish-tauri-linux:
    name: Release (Linux x64)
    needs: [prepare, image]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: [self-hosted, Linux, X64, bydora]
    permissions:
      contents: write
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        include: # same keys as publish-tauri, which shares these steps
          - platform: linux
            label: Linux x64
            args: ""

    steps: *publish-steps
