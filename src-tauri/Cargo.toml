[package]
name = "globalmarket-client"
version = "1.0.0"
description = "Cross-Platform Companion Client for Farming Simulator GlobalMarket (D-S-Agrarservice)"
authors = ["D-S-Agrarservice"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "globalmarket_client_lib"
crate-type = ["rlib"]
test = false

[[bin]]
name = "GlobalMarketClient"
path = "src/main.rs"
test = false

[features]
# By default, embed `../dist` directly into the binary so the `.exe` runs standalone on double-click.
# `tauri dev` automatically passes `--no-default-features` to switch to Vite HMR on localhost:1420.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
quick-xml = { version = "0.37", features = ["serialize"] }
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
